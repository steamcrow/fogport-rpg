name: "Kanka Librarian — Fogport: Civic Vigilance"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-civic-vigilance.yml"
      - "scripts/publish_civic_vigilance.py"
      - "kanka_librarian/approved_organizations/civic-vigilance.json"
      - "assets/organizations/blackcoat-patrol.png.b64.part-*"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Civic Vigilance"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Restore and verify approved Blackcoat patrol image
        run: |
          cat assets/organizations/blackcoat-patrol.png.b64.part-* \
            | base64 --decode > assets/organizations/blackcoat-patrol.png
          echo "d6a0fad43be31bc5902c087ed877bd8a5b560424f2b6cd30806d24041858d400  assets/organizations/blackcoat-patrol.png" \
            | sha256sum --check
      - name: Publish and verify Civic Vigilance
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_civic_vigilance.py \
            kanka_librarian/approved_organizations/civic-vigilance.json \
            --receipt receipts/civic-vigilance.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-civic-vigilance-receipt
          path: receipts/civic-vigilance.json
          if-no-files-found: warn
          retention-days: 90
