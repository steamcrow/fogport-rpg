name: "Kanka Librarian — Publish approved main image"

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Approved image manifest filename"
        required: true
        default: "bellworks.json"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — image only, verify, receipt"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate and test
        run: |
          python -m compileall -q kanka_librarian scripts
          python -m unittest discover -s tests -v
      - name: Publish approved main image and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          approval="kanka_librarian/approved_images/${{ inputs.approval }}"
          test -f "$approval"
          python scripts/publish_approved_main_image.py \
            "$approval" \
            --receipt "receipts/image-$(basename "$approval" .json).json"
      - name: Preserve verified receipt
        uses: actions/upload-artifact@v4
        with:
          name: kanka-main-image-receipt
          path: receipts/image-*.json
          if-no-files-found: error
          retention-days: 90
