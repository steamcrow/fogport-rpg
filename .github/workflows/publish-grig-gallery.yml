name: "Kanka Librarian — Publish Grig Gallery"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — publish Grig servants and Battley"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate repository tests
        run: python -m unittest discover -s tests
      - name: Publish and verify approved gallery
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
        run: |
          python scripts/publish_approved_gallery.py \
            kanka_librarian/approved_gallery/grig-servants-and-battley.json \
            --receipt receipts/grig-servants-and-battley-gallery.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-grig-gallery-receipt
          path: receipts/grig-servants-and-battley-gallery.json
          if-no-files-found: warn
          retention-days: 90
