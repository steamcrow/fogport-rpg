name: "Kanka Librarian — Fogport: Order of the Last Landing"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-order-last-landing.yml"
      - "scripts/publish_order_last_landing.py"
      - "kanka_librarian/approved_organizations/order-last-landing.json"
      - "assets/organizations/order-last-landing.png.b64.part-*"

permissions:
  contents: write

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Order of the Last Landing"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Restore and verify approved Order of the Last Landing image
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          part_dir = Path("assets/organizations")
          parts = sorted(part_dir.glob("order-last-landing.png.b64.part-*"))
          if not parts:
              raise SystemExit("No approved image chunks found.")
          image = b"".join(
              base64.b64decode(part.read_bytes(), validate=True)
              for part in parts
          )
          (part_dir / "order-last-landing.png").write_bytes(image)
          print(f"Restored {len(parts)} approved image chunks ({len(image)} bytes).")
          PY
          echo "aea7ef545f4464ebd5e928bd000f660a78cdb2b3755607d1db745caa019116c8  assets/organizations/order-last-landing.png" | sha256sum --check
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish and verify Order of the Last Landing
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_order_last_landing.py kanka_librarian/approved_organizations/order-last-landing.json --receipt receipts/order-last-landing.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-order-last-landing-receipt
          path: receipts/order-last-landing.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit successful Kanka read-back receipt
        if: success()
        run: |
          git config user.name "Kanka Librarian"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/order-last-landing.json
          if git diff --cached --quiet; then
            echo "Verified receipt is already current."
          else
            git commit -m "Verify Order of the Last Landing in Kanka"
            git push
          fi
