name: "Kanka Librarian — Fogport: Constable Korch"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/characters/constable-korch.jpg.b64"
      - "kanka_librarian/approved_characters/constable-korch.json"
      - "scripts/publish_constable_korch.py"
      - ".github/workflows/publish-constable-korch.yml"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Constable Korch"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Publish and verify Constable Korch
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_constable_korch.py \
            kanka_librarian/approved_characters/constable-korch.json \
            --receipt receipts/constable-korch.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-constable-korch-receipt
          path: receipts/constable-korch.json
          if-no-files-found: error
          retention-days: 90
