name: "Kanka Librarian — Publish The Bellworks"
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-bellworks.yml"
      - "kanka_librarian/approved_locations/bellworks.json"
      - "scripts/publish_bellworks.py"
permissions:
  contents: read
concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false
jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish The Bellworks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Publish and verify The Bellworks
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: python scripts/publish_bellworks.py kanka_librarian/approved_locations/bellworks.json --receipt receipts/bellworks.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-bellworks-receipt
          path: receipts/bellworks.json
          if-no-files-found: warn
          retention-days: 90
