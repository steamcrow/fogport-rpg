name: "Kanka Librarian — Fogport World Map"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-fogport-world-map.yml"
      - "assets/maps/fogport-post-catastrophe-city-map.jpg.b64.part-*"
      - "kanka_librarian/approved_maps/fogport-post-catastrophe-map.json"
      - "scripts/publish_fogport_world_map.py"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — create and verify keyable city map"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Restore approved Kanka-compatible map bytes
        run: |
          cat assets/maps/fogport-post-catastrophe-city-map.jpg.b64.part-* \
            | base64 --decode \
            > assets/maps/fogport-post-catastrophe-city-map.jpg
          echo "d2ebd26073e66100dc1116d585e4c93d29eecbe0cd5dcef28696e03b7a542836  assets/maps/fogport-post-catastrophe-city-map.jpg" \
            | sha256sum --check
          test "$(stat -c %s assets/maps/fogport-post-catastrophe-city-map.jpg)" -le 3145728
      - name: Publish and verify Fogport world map
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_fogport_world_map.py \
            kanka_librarian/approved_maps/fogport-post-catastrophe-map.json \
            --receipt receipts/fogport-world-map.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-fogport-world-map-receipt
          path: receipts/fogport-world-map.json
          if-no-files-found: warn
          retention-days: 90
