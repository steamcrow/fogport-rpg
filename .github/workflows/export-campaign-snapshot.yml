name: "Kanka Librarian — Export campaign snapshot (read only)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport-snapshot-export
  cancel-in-progress: false

jobs:
  export:
    name: "Export read-only name/type/id index of the current campaign"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Export campaign snapshot without writing to Kanka
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          FOGPORT_SNAPSHOT_EXPORT_DIR: ${{ runner.temp }}/fogport-campaign-snapshot
        run: python scripts/export_campaign_snapshot.py
      - name: Upload campaign snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOGPORT-CAMPAIGN-SNAPSHOT
          path: ${{ runner.temp }}/fogport-campaign-snapshot/
          if-no-files-found: error
          retention-days: 14
