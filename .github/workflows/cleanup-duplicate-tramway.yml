name: Delete Audited Fogport Transit Duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Delete only the three approved duplicate Items
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          REPORT_PATH: receipts/transit-duplicate-cleanup.json
        run: python scripts/cleanup_duplicate_tramway.py
      - name: Preserve cleanup receipt
        uses: actions/upload-artifact@v4
        with:
          name: fogport-transit-duplicate-cleanup
          path: receipts/transit-duplicate-cleanup.json
          if-no-files-found: error
          retention-days: 90
