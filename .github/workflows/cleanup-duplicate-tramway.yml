name: Audit Fogport Transit Duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Scan every Kanka Item page (read only)
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          REPORT_PATH: receipts/transit-duplicate-audit.json
        run: python scripts/cleanup_duplicate_tramway.py
      - name: Preserve the complete inventory
        uses: actions/upload-artifact@v4
        with:
          name: fogport-transit-duplicate-audit
          path: receipts/transit-duplicate-audit.json
          if-no-files-found: error
          retention-days: 90
