name: "Kanka Librarian — Publish approved subject"

run-name: "Publish: ${{ inputs.subject != '-- choose a subject --' && inputs.subject || inputs.older_subject }}"

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Choose a recent approved subject to publish"
        required: true
        type: choice
        options:
          # BEGIN AUTO-MENU (run scripts/refresh_publish_menu.py)
          - "-- choose a subject --"
          - "creature: kadovarians"
          - "location: kadovar"
          - "creature: civic-order-patrolmaton"
          - "location: skyport-station"
          - "creature: fisherwitches"
          - "location: orlania"
          - "character: harlok-yix"
          - "creature: ratwretches"
          - "organization: civic-order-mail-service"
          - "episode: bannon-peg-fog-shits-blackwake"
          - "canon: guff-crosslinks"
          - "character: guff"
          - "note: gamemaster-guide-fate-addendum"
          - "episode: nettle-mercy-alliance"
          - "character: mercy-vale"
          - "location: the-wayward-pint"
          - "item-batch: fogport-transit-system"
          # END AUTO-MENU
      older_subject:
        description: "Optional exact label for an older subject"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify ${{ inputs.subject != '-- choose a subject --' && inputs.subject || inputs.older_subject }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Restore approved Fisherwitches checksum
        run: python scripts/repair_fisherwitches_approval.py
      - name: Restore approved Kadovar checksum
        if: ${{ inputs.subject == 'location: kadovar' || inputs.older_subject == 'location: kadovar' }}
        run: python scripts/repair_kadovar_approval.py
      - name: Clear stale receipts from the clean checkout
        run: find receipts -maxdepth 1 -type f -name '*.json' -delete
      - name: Publish and verify the chosen subject
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
          PUBLISH_SUBJECT: ${{ inputs.subject != '-- choose a subject --' && inputs.subject || inputs.older_subject }}
        run: python scripts/publish_selected.py --subject "$PUBLISH_SUBJECT"
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-publish-receipts
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
