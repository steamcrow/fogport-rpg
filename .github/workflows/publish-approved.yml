name: "Kanka Librarian — Publish approved subject"

run-name: "Publish: ${{ inputs.subject != '-- choose a subject --' && inputs.subject || inputs.older_subject }}"

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Choose a recent approved subject to publish"
        required: true
        type: choice
        options:
          # BEGIN AUTO-MENU (run scripts/refresh_publish_menu.py)
          - "-- choose a subject --"
          - "creature: knocker"
          - "creature: snatchbats"
          - "note: fogport-zeppelins"
          - "character: zee-fohr-whun-ait"
          - "location: the-ninth-condition"
          - "note: drugs-of-fogport"
          - "canon: toxia-vane-canon"
          - "organization: golden-god"
          - "creature: mung"
          - "creature: brinebacks"
          - "location: hask"
          - "creature: khoru"
          - "location: ninety-nine-kingdoms-refresh"
          - "character: sister-lya-orlan"
          - "organization: lamplighters-guild"
          - "location: the-wayward-pint"
          - "item-batch: fogport-transit-system"
          # END AUTO-MENU
      older_subject:
        description: "Optional exact label for an older subject"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify ${{ inputs.subject != '-- choose a subject --' && inputs.subject || inputs.older_subject }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Restore approved Ship-Stair checksum
        if: "${{ inputs.subject == 'location: ship-stair-of-keld' || inputs.older_subject == 'location: ship-stair-of-keld' }}"
        run: python scripts/repair_ship_stair_approval.py
      - name: Restore approved Vor checksums
        if: "${{ inputs.subject == 'organization: red-church-of-vor' || inputs.older_subject == 'organization: red-church-of-vor' || inputs.subject == 'location: temple-of-the-red-bat' || inputs.older_subject == 'location: temple-of-the-red-bat' }}"
        run: python scripts/repair_vor_approvals.py
      - name: Clear stale receipts from the clean checkout
        run: find receipts -maxdepth 1 -type f -name '*.json' -delete
      - name: Publish and verify the chosen subject
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
          PUBLISH_SUBJECT: ${{ inputs.subject != '-- choose a subject --' && inputs.subject || inputs.older_subject }}
        run: python scripts/publish_selected.py --subject "$PUBLISH_SUBJECT"
      - name: Cross-link Fogport after Thrx and Devor publish
        if: "${{ inputs.subject == 'canon: thrx-devor-canon' || inputs.older_subject == 'canon: thrx-devor-canon' }}"
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/crosslink_cleanup.py \
            kanka_librarian/approved_crosslinks/fogport-network-cleanup.json \
            --apply \
            --registry receipts/fogport-network-registry.json \
            --receipt receipts/fogport-network-cleanup-receipt.json
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-publish-receipts
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
