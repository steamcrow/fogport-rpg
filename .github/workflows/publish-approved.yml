name: "Kanka Librarian — Publish approved subject"

run-name: "Publish: ${{ inputs.subject }}"

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Choose the approved subject to publish"
        required: true
        type: choice
        options:
          # BEGIN AUTO-MENU (run scripts/refresh_publish_menu.py)
          - "-- choose a subject --"
          - "character: batley"
          - "character: byl-hasbaine"
          - "character: inspector-adelaide-voss"
          - "character: lott"
          - "character: mercy-vale"
          - "character: vauntin-quell"
          - "creature: grig"
          - "creature: thrallo"
          - "episode-batch: blackwake-heliot-promenade"
          - "episode: gm-operating-manual"
          - "episode: gutterkin"
          - "episode: one-door-remaining"
          - "item-batch: fogport-transit-system"
          - "item: cinderhack"
          - "location: blackwake"
          - "location: blackwake-refresh"
          - "location: fogport"
          - "location: fogport-history"
          - "location: grand-heliot-station"
          - "location: grand-promenade"
          - "location: grand-promenade-refresh"
          - "location: mercys-office"
          - "location: nine-spoons"
          - "location: sayir-sea"
          - "location: shambles"
          - "location: the-wayward-pint"
          - "location: twisted-eel-pawnshop"
          - "organization: civic-vigilance"
          - "organization: daughters-last-bell"
          - "organization: order-last-landing"
          # END AUTO-MENU

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify ${{ inputs.subject }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish and verify the chosen subject
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_selected.py --subject "${{ inputs.subject }}"
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-publish-receipts
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
