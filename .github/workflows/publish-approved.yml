name: "Kanka Librarian — Publish approved subject"

run-name: "Publish: ${{ inputs.older_subject || inputs.subject }}"

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Choose a recent approved subject to publish"
        required: true
        type: choice
        options:
          # BEGIN AUTO-MENU (run scripts/refresh_publish_menu.py)
          - "-- choose a subject --"
          - "creature: maton"
          - "creature: apparatus"
          - "note: fogport-cults"
          - "note: fogport-famous"
          - "creature: thrallo"
          - "organization: daughters-last-bell"
          - "organization: order-last-landing"
          - "character: batley"
          - "character: byl-hasbaine"
          - "character: inspector-adelaide-voss"
          - "character: lott"
          - "character: mercy-vale"
          - "character: vauntin-quell"
          - "creature: grig"
          - "episode-batch: blackwake-heliot-promenade"
          # END AUTO-MENU
      older_subject:
        description: "Optional: exact label for an older subject, e.g. character: mercy-vale"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify ${{ inputs.older_subject || inputs.subject }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The compact menu is ordered by each manifest's last commit.
          # A full history keeps its safety test stable in Actions.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish and verify the chosen subject
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
          PUBLISH_SUBJECT: ${{ inputs.older_subject || inputs.subject }}
        run: |
          python scripts/publish_selected.py --subject "$PUBLISH_SUBJECT"
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-publish-receipts
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
