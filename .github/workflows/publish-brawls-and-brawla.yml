name: "Kanka Librarian — Fogport: Brawls and Brawla"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Brawls and Brawla"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Create and verify Brawla organization
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_compiled_episode.py kanka_librarian/approved_episodes/brawla.json --receipt receipts/brawla-first-pass.json
      - name: Publish and verify Brawls note
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_compiled_episode.py kanka_librarian/approved_notes/brawls.json --receipt receipts/brawls.json
      - name: Verify reciprocal Brawls link on Brawla
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_compiled_episode.py kanka_librarian/approved_episodes/brawla.json --receipt receipts/brawla-final.json
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-brawls-and-brawla-receipts
          path: |
            receipts/brawla-*.json
            receipts/brawls.json
          if-no-files-found: error
          retention-days: 90
