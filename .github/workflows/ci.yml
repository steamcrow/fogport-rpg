name: "Kanka Librarian — Tests"

on:
  push:
    branches: [main]
    paths:
      - "kanka_librarian/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "kanka_librarian/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m compileall -q scripts kanka_librarian
      - run: python scripts/audit_librarian_safety.py
      - run: python -m unittest discover -s tests
