name: "Fogport Librarian — GM Operating Manual"

on:
  workflow_dispatch:
  push:
    paths:
      - "kanka_librarian/approved_episodes/gm-operating-manual.json"
      - ".github/workflows/publish-gm-operating-manual.yml"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify GM notes"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate repository tests
        run: python -m unittest discover -s tests
      - name: Publish GM operating notes and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_compiled_episode.py \
            kanka_librarian/approved_episodes/gm-operating-manual.json \
            --receipt receipts/gm-operating-manual.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-gm-operating-manual-receipt
          path: receipts/gm-operating-manual.json
          if-no-files-found: warn
          retention-days: 90

