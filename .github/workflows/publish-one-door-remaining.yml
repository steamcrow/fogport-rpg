name: "Kanka Librarian — Publish One Door Remaining"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — compile, publish, and verify episode"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate repository tests
        run: python -m unittest discover -s tests
      - name: Publish compiled episode and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_compiled_episode.py \
            kanka_librarian/approved_episodes/one-door-remaining.json \
            --receipt receipts/one-door-remaining.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-one-door-remaining-receipt
          path: receipts/one-door-remaining.json
          if-no-files-found: warn
          retention-days: 90
