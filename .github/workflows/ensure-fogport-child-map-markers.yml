name: "Kanka Librarian — Fogport Child Map Coverage"

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — verify top-level map coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Preserve existing pins and add missing Fogport child pins
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/ensure_fogport_child_map_markers.py \
            kanka_librarian/approved_maps/fogport-immediate-child-markers.json \
            --receipt receipts/fogport-immediate-child-markers.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-fogport-immediate-child-markers-receipt
          path: receipts/fogport-immediate-child-markers.json
          if-no-files-found: warn
          retention-days: 90
