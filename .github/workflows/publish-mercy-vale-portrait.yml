name: "Kanka Librarian — Fogport: Mercy Vale Portrait"

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — attach and verify Mercy portrait"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Publish and verify Mercy Vale portrait
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_character_portrait.py \
            kanka_librarian/approved_gallery/mercy-vale-portrait.json \
            --receipt receipts/mercy-vale-portrait.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-mercy-vale-portrait-receipt
          path: receipts/mercy-vale-portrait.json
          if-no-files-found: warn
          retention-days: 90
