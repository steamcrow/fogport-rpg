name: Publish GM Cinematic Fate Guidance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY — add cinematic Fate guidance to Gamemaster Guide"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Merge approved Fate guidance and exactly verify Kanka
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          REPORT_PATH: receipts/gamemaster-guide-cinematic-fate.json
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_gm_fate_addendum.py
      - name: Preserve exact update receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamemaster-guide-cinematic-fate-receipt
          path: receipts/gamemaster-guide-cinematic-fate.json
          if-no-files-found: error
          retention-days: 90
