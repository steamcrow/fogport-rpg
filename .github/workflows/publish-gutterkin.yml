name: "Kanka Librarian — Fogport: Publish Gutterkin"

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"
  push:
    paths:
      - ".github/workflows/publish-gutterkin.yml"
      - "kanka_librarian/approved/gutterkin.json"
      - "scripts/publish_compiled_episode.py"
      - "tests/test_publish_compiled_episode.py"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Gutterkin"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate repository tests
        run: python -m unittest discover -s tests

      - name: Publish Gutterkin and refresh Nettle
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_compiled_episode.py \
            kanka_librarian/approved/gutterkin.json \
            --receipt receipts/gutterkin.json

      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-gutterkin-receipt
          path: receipts/gutterkin.json
          if-no-files-found: warn
          retention-days: 90
