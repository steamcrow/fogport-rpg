name: "Kanka Librarian — Fogport: The Divided Saint"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify The Divided Saint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Restore and verify approved Divided Saint artwork
        run: |
          cat assets/organizations/divided-saint.png.b64.part-* | base64 --decode > assets/organizations/divided-saint.png
          echo "0cc75290a86f44950732116572514b7b9b8fbd35d33318a3054e4e133fea2f16  assets/organizations/divided-saint.png" | sha256sum --check
      - name: Publish The Divided Saint and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_divided_saint.py \
            kanka_librarian/approved_organizations/divided-saint.json \
            --receipt receipts/divided-saint.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-divided-saint-publication-receipt
          path: receipts/divided-saint.json
          if-no-files-found: warn
          retention-days: 90
