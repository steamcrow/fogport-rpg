name: "Kanka Librarian — Publish approved Fogport location"

on:
  push:
    branches: [main]
    paths:
      - "kanka_librarian/approved/*.json"
      - "assets/locations/**"
      - "scripts/publish_approved_location.py"
  workflow_dispatch:
    inputs:
      proposal:
        description: "Approved proposal filename"
        required: true
        default: "mercys-office.json"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — publish and verify"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Select approved proposal
        id: proposal
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            file="kanka_librarian/approved/${{ inputs.proposal }}"
          else
            file="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'kanka_librarian/approved/*.json' | head -n 1)"
          fi
          test -n "$file"
          test -f "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Publish and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_approved_location.py \
            "${{ steps.proposal.outputs.file }}" \
            --receipt "receipts/$(basename "${{ steps.proposal.outputs.file }}" .json).json"
      - name: Preserve verified receipt
        uses: actions/upload-artifact@v4
        with:
          name: kanka-publication-receipt
          path: receipts/*.json
          if-no-files-found: error
          retention-days: 90
