name: "Kanka Librarian — Advanced location publisher"

on:
  workflow_dispatch:
    inputs:
      proposal:
        description: "Advanced: exact approved location filename (no default)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — publish selected location and verify"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Select approved proposal
        id: proposal
        shell: bash
        run: |
          filename="${{ inputs.proposal }}"
          [[ "$filename" =~ ^[A-Za-z0-9._-]+\.json$ ]]
          file="kanka_librarian/approved/$filename"
          test -f "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Publish and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_approved_location.py \
            "${{ steps.proposal.outputs.file }}" \
            --receipt "receipts/$(basename "${{ steps.proposal.outputs.file }}" .json).json"
      - name: Preserve verified receipt
        uses: actions/upload-artifact@v4
        with:
          name: kanka-location-publication-receipt
          path: receipts/*.json
          if-no-files-found: error
          retention-days: 90
