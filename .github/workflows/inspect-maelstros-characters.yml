name: Inspect MAELSTROS Characters — Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-maelstros-characters:
    name: Read MAELSTROS characters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Inspect MAELSTROS characters only
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
        run: python scripts/inspect_maelstros_characters.py
