name: "Kanka Librarian — Fogport: Publish Unhorse"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Unhorse"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish and exact-read-back Unhorse
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_approved_creature.py \
            kanka_librarian/approved_creatures/unhorse.json \
            --receipt receipts/unhorse-creature.json
      - name: Attach and verify approved Unhorse portrait
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_creature_portrait.py \
            kanka_librarian/approved_creature_portraits/unhorse.json \
            --receipt receipts/unhorse-portrait.json
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-unhorse-publication-receipts
          path: receipts/unhorse-*.json
          if-no-files-found: warn
          retention-days: 90
