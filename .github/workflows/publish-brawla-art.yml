name: "Kanka Librarian — Fogport: Brawla Art"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Brawla art"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Ensure Brawla organization exists
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_compiled_episode.py kanka_librarian/approved_episodes/brawla.json --receipt receipts/brawla-before-art.json
      - name: Ensure linked Brawls note exists
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_compiled_episode.py kanka_librarian/approved_notes/brawls.json --receipt receipts/brawls-before-art.json
      - name: Verify reciprocal Brawls link on Brawla
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_compiled_episode.py kanka_librarian/approved_episodes/brawla.json --receipt receipts/brawla-linked-before-art.json
      - name: Set the Thief as Brawla main image
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_organization_main_image.py kanka_librarian/approved_images/brawla-thief.json --receipt receipts/brawla-main-image.json
      - name: Add Bruiser Cutler and Soaker to the public gallery
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_approved_gallery.py kanka_librarian/approved_gallery/brawla-portraits.json --receipt receipts/brawla-gallery.json
      - name: Embed the three supporting portraits in Brawla
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/embed_organization_gallery.py kanka_librarian/approved_entries/brawla-gallery.json --receipt receipts/brawla-gallery-embed.json
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-brawla-art-receipts
          path: |
            receipts/brawla-before-art.json
            receipts/brawls-before-art.json
            receipts/brawla-linked-before-art.json
            receipts/brawla-main-image.json
            receipts/brawla-gallery.json
            receipts/brawla-gallery-embed.json
          if-no-files-found: error
          retention-days: 90
