name: "Kanka Librarian — Grand Heliot Station Map Pin"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-grand-heliot-station-marker.yml"
      - "kanka_librarian/approved_maps/grand-heliot-station-marker.json"
      - "scripts/publish_fogport_map_marker.py"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — link Grand Heliot Station map pin"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Publish and verify linked station pin
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_fogport_map_marker.py \
            kanka_librarian/approved_maps/grand-heliot-station-marker.json \
            --receipt receipts/grand-heliot-station-marker.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-grand-heliot-station-marker-receipt
          path: receipts/grand-heliot-station-marker.json
          if-no-files-found: warn
          retention-days: 90
