name: "Kanka Librarian — Fogport: Cinderhack"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-cinderhack.yml"
      - "scripts/publish_cinderhack.py"
      - "kanka_librarian/approved_items/cinderhack.json"
      - "assets/items/cinderhack.png.b64.part-*"

permissions:
  contents: write

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Cinderhack"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Restore and verify approved Cinderhack image
        run: |
          cat assets/items/cinderhack.png.b64.part-* \
            | base64 --decode > assets/items/cinderhack.png
          echo "0d76846fabc12331ed6b109efc7b9ea673cf268f040bddc3b99c24fb895bcd6a  assets/items/cinderhack.png" \
            | sha256sum --check
      - name: Publish and verify Cinderhack
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_cinderhack.py \
            kanka_librarian/approved_items/cinderhack.json \
            --receipt receipts/cinderhack.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-cinderhack-receipt
          path: receipts/cinderhack.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit successful Kanka read-back receipt
        if: success()
        run: |
          git config user.name "Kanka Librarian"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/cinderhack.json
          if git diff --cached --quiet; then
            echo "Verified receipt is already current."
          else
            git commit -m "Verify Cinderhack in Kanka"
            git push
          fi
