name: "Kanka Librarian — Fogport: Bell-Dead Portrait"

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — attach and verify Bell-Dead portrait"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Restore approved portrait bytes
        run: base64 --decode assets/creatures/bell-dead.jpg.b64 > assets/creatures/bell-dead.jpg
      - name: Publish and verify Bell-Dead portrait
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_creature_portrait.py \
            kanka_librarian/approved_gallery/bell-dead-portrait.json \
            --receipt receipts/bell-dead-portrait.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-bell-dead-portrait-receipt
          path: receipts/bell-dead-portrait.json
          if-no-files-found: warn
          retention-days: 90
