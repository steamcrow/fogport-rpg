name: Update Exact Fogport Gamemaster Guide

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  fix:
    name: "FOGPORT ONLY — update and verify Note 9626686"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Update and exactly verify the intended Gamemaster Note
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          MANIFEST_PATH: kanka_librarian/approved_notes/gamemaster-guide-v3.json
          REPORT_PATH: receipts/gamemaster-guide-v3.json
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_exact_gamemaster_guide.py
      - name: Preserve exact update receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-gamemaster-guide-update-receipt
          path: receipts/gamemaster-guide-v3.json
          if-no-files-found: error
          retention-days: 90
