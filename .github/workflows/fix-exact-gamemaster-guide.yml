name: Fix Exact Fogport Gamemaster Guide and Clean Misplaced Journals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  fix:
    name: "FOGPORT ONLY — update Note 9626686, then clean 9 audited Journals"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Update and exactly verify the intended Gamemaster Note
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          MANIFEST_PATH: kanka_librarian/approved_notes/gamemaster-guide-v2.json
          REPORT_PATH: receipts/gamemaster-guide-v2.json
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/publish_exact_gamemaster_guide.py
      - name: Delete and verify only the nine audited misplaced Journals
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          REPORT_PATH: receipts/gamemaster-journal-cleanup.json
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/cleanup_misplaced_gm_journals.py
      - name: Preserve exact update and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-gamemaster-guide-fix-receipts
          path: |
            receipts/gamemaster-guide-v2.json
            receipts/gamemaster-journal-cleanup.json
          if-no-files-found: error
          retention-days: 90
