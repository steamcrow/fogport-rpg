name: "Kanka Librarian — Fogport: Finish Calendar"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — finish calendar and verify reminders"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate repository tests
        run: python -m unittest discover -s tests
      - name: Finish Fogport Calendar
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_fogport_calendar.py \
            kanka_librarian/approved/fogport-calendar.json \
            --receipt receipts/fogport-calendar.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-fogport-calendar-receipt
          path: receipts/fogport-calendar.json
          if-no-files-found: warn
          retention-days: 90
