name: "Kanka Librarian — Publish Nine Spoons"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — publish Nine Spoons and verify"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish Nine Spoons and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_approved_location.py \
            kanka_librarian/approved/nine-spoons.json \
            --receipt receipts/nine-spoons.json
      - name: Preserve verified Nine Spoons receipt
        uses: actions/upload-artifact@v4
        with:
          name: kanka-nine-spoons-publication-receipt
          path: receipts/nine-spoons.json
          if-no-files-found: error
          retention-days: 90
