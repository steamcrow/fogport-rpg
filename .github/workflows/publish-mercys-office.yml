name: "Kanka Librarian — Fogport: Publish Mercy’s Office"

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  publish:
    name: "FOGPORT 410879 — Publish approved Mercy’s Office"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify Fogport and publish exact approved entry
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from kanka_librarian.client import KankaClient
          from kanka_librarian.publisher import validate_approved_proposal
          from kanka_librarian.writer import KankaWriter

          campaign_id = 410879
          expected_campaign_name = "Fogport"
          approved_digest = "8e0be0a17e913b7907f7549f68db71f256a2eb2da09696b02ca5e144285f9cfe"

          document = json.loads(
              Path("kanka_librarian/approved/mercys-office.json").read_text(encoding="utf-8")
          )
          validate_approved_proposal(document)
          if document["approval"]["proposal_sha256"] != approved_digest:
              raise SystemExit(
                  "Mercy’s Office approval checksum differs from this workflow’s locked version."
              )
          assert len(document["proposals"]) == 1
          change = document["proposals"][0]
          assert change["name"] == "Mercy’s Office"

          client = KankaClient(os.environ["KANKA_API_TOKEN"])
          campaign = client.get_campaign(campaign_id)
          actual_campaign_name = str(campaign.get("name", "")).strip()
          if actual_campaign_name.casefold() != expected_campaign_name.casefold():
              raise SystemExit(
                  f"Campaign lock failed: ID {campaign_id} is {actual_campaign_name!r}, "
                  f"not {expected_campaign_name!r}."
              )

          locations = client.list_locations(campaign_id)
          accepted_parent_names = {
              "the twisted eel pawnshop",
              "twisted eel pawnshop",
              "the twisted eel",
              "twisted eel",
          }
          parents = [
              item for item in locations
              if str(item.get("name", "")).casefold() in accepted_parent_names
          ]
          accepted_names = {"mercy’s office", "mercy's office"}
          matches = [
              item for item in locations
              if str(item.get("name", "")).casefold() in accepted_names
          ]
          if len(parents) != 1:
              raise SystemExit(
                  f"Expected exactly one Twisted Eel Pawnshop in Fogport; found {len(parents)}."
              )
          if len(matches) > 1:
              raise SystemExit("More than one Mercy’s Office candidate exists; refusing to guess.")

          parent_entity_id = int(parents[0]["entity_id"])
          entry = change["entry"]
          payload = {
              "name": change["name"],
              "type": change["type"],
              "is_private": change["is_private"],
              "entry": entry,
              "parent_id": parent_entity_id,
          }
          writer = KankaWriter(
              token=os.environ["KANKA_API_TOKEN"],
              expected_campaign_id=campaign_id,
          )
          def read_parent_id(entity_id):
              response = client._get(f"campaigns/{campaign_id}/entities/{entity_id}")
              entity = response.get("data", {})
              return int(entity.get("parent_id") or 0)

          already_published = False
          if matches:
              location_id = int(matches[0]["id"])
              entity_id = int(matches[0]["entity_id"])
              direct = client._get(f"campaigns/{campaign_id}/locations/{location_id}")
              current = direct.get("data", {})
              already_published = (
                  str(current.get("name", "")) == change["name"]
                  and read_parent_id(entity_id) == parent_entity_id
                  and str(current.get("entry", "")) == entry
                  and bool(current.get("is_private")) == bool(change["is_private"])
              )
              item = current
          else:
              result = writer.create_entity(campaign_id, "locations", payload)
              location_id = int(result["id"])
              entity_id = int(result["entity_id"])
              item = result

          if not already_published:
              for attempt in range(3):
                  item = writer.update_entity(campaign_id, "locations", location_id, payload)
                  if read_parent_id(entity_id) == parent_entity_id:
                      break
                  time.sleep(3)
                  direct = client._get(f"campaigns/{campaign_id}/locations/{location_id}")
                  item = direct.get("data", {})
                  if read_parent_id(entity_id) == parent_entity_id:
                      break

          if not isinstance(item, dict):
              raise SystemExit("Kanka did not return the Mercy’s Office record.")
          actual_parent_id = read_parent_id(entity_id)
          if actual_parent_id != parent_entity_id:
              raise SystemExit(
                  f"Mercy’s Office has unexpected parent_id {actual_parent_id or None!r}."
              )
          if str(item.get("name", "")) != change["name"]:
              raise SystemExit("Published name does not match the approved title.")

          published_entry = str(item.get("entry", ""))
          required = (
              "KNOCK ONCE. WAIT.", "green-shaded lamp", "bolted to the floor",
              "iron safe", "speaking tube", "Tea is frequently served",
              "owing considerably more than they expected"
          )
          for phrase in required:
              if phrase not in published_entry:
                  raise SystemExit(f"Published entry is missing {phrase}.")

          overview_url = f"https://app.kanka.io/w/{campaign_id}/entities/{entity_id}"
          receipt = {
              "published": True,
              "already_current": already_published,
              "campaign": actual_campaign_name,
              "campaign_id": campaign_id,
              "location_id": location_id,
              "entity_id": entity_id,
              "parent_entity_id": parent_entity_id,
              "name": item.get("name"),
              "overview_url": overview_url,
          }
          print(json.dumps(receipt, indent=2))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("# Fogport publication verified\n\n")
                  summary.write(f"- Campaign: **{actual_campaign_name}** ({campaign_id})\n")
                  summary.write("- Entity: **Mercy’s Office**\n")
                  summary.write(f"- [Open Mercy’s Office Overview]({overview_url})\n")
          PY
