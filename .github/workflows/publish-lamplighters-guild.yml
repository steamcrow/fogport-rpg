name: "Kanka Librarian — Fogport: Lamplighters' Guild"

on:
  push:
    paths:
      - "kanka_librarian/approved_organizations/lamplighters-guild.json"
      - ".github/workflows/publish-lamplighters-guild.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Lamplighters' Guild"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish Lamplighters' Guild and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_approved_organization.py \
            kanka_librarian/approved_organizations/lamplighters-guild.json \
            --receipt receipts/lamplighters-guild.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-lamplighters-guild-publication-receipt
          path: receipts/lamplighters-guild.json
          if-no-files-found: error
          retention-days: 90
