name: "Kanka Librarian — Fogport: Publish Annual Observances"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify annual observances"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate repository tests
        run: python -m unittest discover -s tests
      - name: Publish annual observances
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_compiled_episode.py \
            kanka_librarian/approved/fogport-annual-observances.json \
            --receipt receipts/fogport-annual-observances.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-fogport-annual-observances-receipt
          path: receipts/fogport-annual-observances.json
          if-no-files-found: warn
          retention-days: 90
