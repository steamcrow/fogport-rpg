name: Test Kanka Connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-read-only-test
  cancel-in-progress: false

jobs:
  list-campaigns:
    name: List accessible Kanka campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
      KANKA_API_BASE_URL: https://api.kanka.io/1.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify secret exists
        shell: bash
        run: |
          if [ -z "$KANKA_API_TOKEN" ]; then
            echo "KANKA_API_TOKEN has not been configured in repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: List campaigns — read only
        run: python scripts/list_campaigns.py
