name: "Kanka Librarian — Lastlight and Saint Orra"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-lastlight-and-saint-orra.yml"
      - "kanka_librarian/approved_maps/lastlight-and-saint-orra.json"
      - "scripts/publish_lastlight_and_saint_orra.py"
      - "assets/locations/saint-orra-colossus-approved.jpg.b64"

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish Lastlight and Saint Orra"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Update district, monument, image, GM secret, and scaled map pin
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_lastlight_and_saint_orra.py \
            kanka_librarian/approved_maps/lastlight-and-saint-orra.json \
            --receipt receipts/lastlight-and-saint-orra.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-lastlight-and-saint-orra-receipt
          path: receipts/lastlight-and-saint-orra.json
          if-no-files-found: warn
          retention-days: 90
