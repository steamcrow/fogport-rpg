name: Publish Sayir Sea to Fogport

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish approved Sayir Sea
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify exact approved proposal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from kanka_librarian.publisher import validate_approved_proposal
          document = json.loads(Path("kanka_librarian/approved/sayir-sea.json").read_text(encoding="utf-8"))
          validate_approved_proposal(document)
          assert document["approval"]["proposal_sha256"] == "815a6f01d64649b3f684f16f5574dc0e681b87e70d70e9bd434703ecfb7fd990"
          assert len(document["proposals"]) == 1
          assert document["proposals"][0]["name"] == "Sayir Sea"
          PY

      - name: Check for an existing exact location
        id: preflight
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from kanka_librarian.client import KankaClient
          matches = [
              item for item in KankaClient(os.environ["KANKA_API_TOKEN"]).list_locations(410879)
              if str(item.get("name", "")).casefold() == "sayir sea"
          ]
          if len(matches) > 1:
              raise SystemExit("More than one exact Sayir Sea location exists; refusing to guess.")
          Path("/tmp/sayir-preflight.json").write_text(json.dumps(matches, ensure_ascii=False))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"exists={'true' if matches else 'false'}\n")
          PY

      - name: Publish to Fogport
        if: steps.preflight.outputs.exists == 'false'
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/apply_approved_proposal.py kanka_librarian/approved/sayir-sea.json --execute

      - name: Verify publication and record IDs
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
        run: |
          mkdir -p kanka_librarian/published
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from kanka_librarian.client import KankaClient
          matches = [
              item for item in KankaClient(os.environ["KANKA_API_TOKEN"]).list_locations(410879)
              if str(item.get("name", "")).casefold() == "sayir sea"
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Sayir Sea after publishing; found {len(matches)}.")
          item = matches[0]
          expected = "The Sayir Sea is an old and uncertain body of water"
          if expected not in str(item.get("entry", "")):
              raise SystemExit("Sayir Sea exists but its approved description was not present.")
          result = {
              "campaign_id": 410879,
              "campaign_name": "Fogport",
              "location_id": item.get("id"),
              "entity_id": item.get("entity_id"),
              "name": item.get("name"),
              "type": item.get("type"),
              "is_private": item.get("is_private"),
              "published_description_verified": True,
              "kanka_url": f"https://app.kanka.io/w/410879/entities/{item.get('entity_id')}"
          }
          Path("kanka_librarian/published/sayir-sea.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-sayir-sea-receipt
          path: kanka_librarian/published/sayir-sea.json
          if-no-files-found: error
          retention-days: 90
