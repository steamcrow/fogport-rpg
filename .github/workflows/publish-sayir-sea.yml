name: Publish Sayir Sea to Fogport

on:
  push:
    paths:
      - ".github/workflows/publish-sayir-sea.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish approved Sayir Sea
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify exact approved proposal
        working-directory: kanka_librarian
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from publisher import validate_approved_proposal
          document = json.loads(Path("approved/sayir-sea.json").read_text(encoding="utf-8"))
          validate_approved_proposal(document)
          assert document["approval"]["proposal_sha256"] == "815a6f01d64649b3f684f16f5574dc0e681b87e70d70e9bd434703ecfb7fd990"
          assert len(document["proposals"]) == 1
          assert document["proposals"][0]["name"] == "Sayir Sea"
          PY

      - name: Publish to Fogport
        working-directory: kanka_librarian
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: python apply_approved_proposal.py approved/sayir-sea.json --execute
