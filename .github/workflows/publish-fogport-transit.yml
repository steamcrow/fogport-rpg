name: Publish Fogport Transit Entries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run safety tests
        run: python -m unittest discover -s tests
      - name: Validate approved transit batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.publish_approved_item_batch import validate
          path = Path("kanka_librarian/approved_items/fogport-transit-system.json")
          validate(json.loads(path.read_text(encoding="utf-8")))
          PY
      - name: Publish and verify Kanka entries
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_approved_item_batch.py \
            kanka_librarian/approved_items/fogport-transit-system.json \
            --receipt receipts/fogport-transit-system.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-fogport-transit-receipt
          path: receipts/fogport-transit-system.json
          if-no-files-found: error
          retention-days: 90
