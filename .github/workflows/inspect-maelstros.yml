name: Kanka Librarian — MAELSTROS Secure Read Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-maelstros.yml"
      - "scripts/snapshot_maelstros.py"
      - "kanka_librarian.py"
      - "kanka_librarian/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  snapshot-maelstros:
    name: Validate secure unified MAELSTROS snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build temporary full-content snapshot
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_SNAPSHOT_PATH: ${{ runner.temp }}/maelstros-snapshot.json
        run: python scripts/snapshot_maelstros.py

      - name: Validate secure snapshot shape
        env:
          KANKA_SNAPSHOT_PATH: ${{ runner.temp }}/maelstros-snapshot.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["KANKA_SNAPSHOT_PATH"])
          snapshot = json.loads(path.read_text(encoding="utf-8"))

          assert snapshot["mode"] == "read-only"
          assert snapshot["content_scope"] == "descriptions-and-posts"
          assert snapshot["campaign"]["id"] == 29474
          assert snapshot["campaign"]["name"].casefold() == "maelstros"
          assert snapshot["protected_campaign"] == {
              "id": 410879,
              "name": "Fogport",
              "accessed": False,
          }
          assert set(snapshot) == {
              "schema_version",
              "generated_at",
              "mode",
              "content_scope",
              "campaign",
              "protected_campaign",
              "locations",
              "characters",
              "organizations",
              "creatures",
              "posts",
          }

          for section in ("locations", "characters", "organizations", "creatures"):
              for entity in snapshot[section]:
                  assert "entry" in entity

          for post in snapshot["posts"]:
              assert "entity_id" in post
              assert "entry" in post
              assert "visibility_id" in post
              assert "is_private" in post

          print(
              "Validated temporary full-content snapshot without printing entity content: "
              f"{len(snapshot['locations'])} locations, "
              f"{len(snapshot['characters'])} characters, "
              f"{len(snapshot['organizations'])} organizations, "
              f"{len(snapshot['creatures'])} creatures, "
              f"{len(snapshot['posts'])} entity posts."
          )
          PY

      - name: Remove temporary snapshot
        if: always()
        env:
          KANKA_SNAPSHOT_PATH: ${{ runner.temp }}/maelstros-snapshot.json
        run: rm -f -- "$KANKA_SNAPSHOT_PATH"
