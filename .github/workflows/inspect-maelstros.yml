name: Kanka Librarian — MAELSTROS Read Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-maelstros.yml"
      - "scripts/snapshot_maelstros.py"
      - "kanka_librarian.py"
      - "kanka_librarian/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  snapshot-maelstros:
    name: Validate unified MAELSTROS snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build metadata-only snapshot
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_SNAPSHOT_PATH: ${{ runner.temp }}/maelstros-snapshot.json
        run: python scripts/snapshot_maelstros.py

      - name: Validate safe snapshot shape
        env:
          KANKA_SNAPSHOT_PATH: ${{ runner.temp }}/maelstros-snapshot.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["KANKA_SNAPSHOT_PATH"])
          snapshot = json.loads(path.read_text(encoding="utf-8"))

          assert snapshot["mode"] == "read-only"
          assert snapshot["campaign"]["id"] == 29474
          assert snapshot["campaign"]["name"].casefold() == "maelstros"
          assert snapshot["protected_campaign"] == {
              "id": 410879,
              "name": "Fogport",
              "accessed": False,
          }
          assert set(snapshot) == {
              "schema_version",
              "generated_at",
              "mode",
              "campaign",
              "protected_campaign",
              "locations",
              "characters",
              "organizations",
              "creatures",
          }

          forbidden = {"entry", "image", "image_full", "tooltip", "header_full"}
          for section in ("locations", "characters", "organizations", "creatures"):
              for entity in snapshot[section]:
                  assert forbidden.isdisjoint(entity)

          print(
              "Validated metadata-only snapshot: "
              f"{len(snapshot['locations'])} locations, "
              f"{len(snapshot['characters'])} characters, "
              f"{len(snapshot['organizations'])} organizations, "
              f"{len(snapshot['creatures'])} creatures."
          )
          PY

      - name: Remove temporary snapshot
        if: always()
        env:
          KANKA_SNAPSHOT_PATH: ${{ runner.temp }}/maelstros-snapshot.json
        run: rm -f -- "$KANKA_SNAPSHOT_PATH"
