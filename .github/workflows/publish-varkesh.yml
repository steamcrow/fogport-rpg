name: "Kanka Librarian — Fogport: Varkesh"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Varkesh"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Restore and verify approved Varkesh artwork
        run: |
          cat assets/creatures/varkesh-dockworker.png.b64.part-* | base64 --decode > assets/creatures/varkesh-dockworker.png
          echo "196b7d74f91651f6ccebc655457b496b927332395eaa3682df7ccf8ba1729c87  assets/creatures/varkesh-dockworker.png" | sha256sum --check
      - name: Publish Varkesh and exact-read-back
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_varkesh.py \
            kanka_librarian/approved_creatures/varkesh.json \
            --receipt receipts/varkesh.json
      - name: Preserve verified receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-varkesh-publication-receipt
          path: receipts/varkesh.json
          if-no-files-found: error
          retention-days: 90
