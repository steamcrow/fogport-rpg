name: "Kanka Librarian — Fogport: Publish Fogport Weather"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT ONLY (410879) — publish and verify Fogport Weather"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish linked Fogport Weather note
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/publish_compiled_episode.py \
            kanka_librarian/approved_notes/fogport-weather.json \
            --receipt receipts/fogport-weather-note.json
      - name: Attach and verify Yellowgasp illustration
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
        run: |
          python scripts/publish_note_main_image.py \
            kanka_librarian/approved_images/fogport-weather-yellowgasp.json \
            --receipt receipts/fogport-weather-image.json
      - name: Preserve verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-fogport-weather-receipts
          path: receipts/fogport-weather-*.json
          if-no-files-found: error
          retention-days: 90
