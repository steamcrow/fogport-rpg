name: "Kanka Librarian — Advanced episode publisher"

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Advanced: exact approved episode batch filename (no default)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kanka-librarian-fogport
  cancel-in-progress: false

jobs:
  publish:
    name: "FOGPORT 410879 — publish selected episode and verify"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Run Librarian safety tests
        run: python -m unittest discover -s tests
      - name: Publish approved episode batch
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
          KANKA_ENABLE_WRITES: FOGPORT_410879
          PYTHONPATH: ${{ github.workspace }}
        run: |
          filename="${{ inputs.batch }}"
          [[ "$filename" =~ ^[A-Za-z0-9._-]+\.json$ ]]
          batch="kanka_librarian/approved_batches/$filename"
          test -f "$batch"
          python scripts/publish_approved_batch.py \
            "$batch" \
            --receipt "receipts/$filename"
      - name: Preserve all verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanka-episode-publication-receipts
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
